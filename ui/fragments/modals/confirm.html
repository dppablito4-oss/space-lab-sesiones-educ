    <!-- ═══════════ CONFIRM DIALOG ═══════════ -->
    <div id="confirm-dialog" class="confirm-overlay hidden">
        <div class="confirm-card glass-card">
            <div class="confirm-icon"><svg class="ui-icon" aria-hidden="true"><use href="#icon-alert"></use></svg></div>
            <h3 id="confirm-title">¿Estás seguro?</h3>
            <p id="confirm-message">Esta acción no se puede deshacer.</p>
            <div class="confirm-actions">
                <button id="confirm-cancel" class="btn btn-ghost">Cancelar</button>
                <button id="confirm-deny" class="btn btn-warning hidden">No Guardar</button>
                <button id="confirm-accept" class="btn btn-danger">Confirmar</button>
            </div>
        </div>
    </div>
