    <!-- ═══════════ LOGOS GALLERY MODAL ═══════════ -->
    <div id="logos-gallery-modal" class="load-modal hidden no-print" style="z-index: 9998;">
        <div class="load-modal-content glass-card" style="max-width: 520px; padding: 2rem; position: relative;">
            <button id="btn-close-gallery-modal" class="btn btn-ghost btn-sm" aria-label="Cerrar" style="position: absolute; top: 1rem; right: 1rem; color: #71717a; cursor: pointer; background: none; border: none; padding: 0;"><svg class="ui-icon" aria-hidden="true"><use href="#icon-close"></use></svg></button>
            <h3 style="margin: 0 0 1rem 0; font-size: 1.2rem; color: #fff; font-weight: 700; display: flex; align-items: center; gap: 8px;"><svg class="ui-icon" aria-hidden="true"><use href="#icon-image"></use></svg> Galería de Logos del Encabezado</h3>
            
            <!-- Upload Area -->
            <div id="modal-logo-dropzone" class="source-file-dropzone" style="border: 2px dashed rgba(0, 210, 255, 0.2); background: rgba(0, 210, 255, 0.02); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 1.5rem;">
                <span class="icon" style="display: block; margin-bottom: 8px;"><svg class="ui-icon" aria-hidden="true"><use href="#icon-upload"></use></svg></span>
                <span class="text" style="font-size: 0.8rem; color: #a1a1aa; line-height: 1.4;">Sube tu logo para el encabezado (PNG, JPG)<br><strong style="color: #00d2ff;">Se comprimirá automáticamente</strong> para un rendimiento ultra-rápido</span>
                <input type="file" id="input-modal-upload-logo" accept="image/png,image/jpeg,image/webp" class="hidden">
            </div>

            <!-- Divider -->
            <div class="toolbar-divider" style="margin: 1.5rem 0; background: rgba(255,255,255,0.06); height: 1px; width: 100%;"></div>

            <!-- Gallery List -->
            <h4 style="margin: 0 0 0.75rem 0; font-size: 0.9rem; color: #e4e4e7;">Tus logos subidos previamente:</h4>
            <div id="modal-logos-container" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 200px; overflow-y: auto; padding: 8px; background: rgba(0,0,0,0.25); border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 1.5rem;">
                <!-- Cargado dinámicamente -->
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button type="button" id="btn-modal-gallery-close" class="btn btn-ghost btn-sm" style="font-size: 0.8rem; padding: 6px 16px;">Cerrar</button>
            </div>
        </div>
    </div>
