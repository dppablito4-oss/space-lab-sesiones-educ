    <!-- ═══════════ AUTH MODAL ═══════════ -->
    <div id="auth-modal" class="load-modal hidden" style="z-index: 9999;">
        <div class="load-modal-content glass-card auth-premium-card"
            style="max-width: 420px; padding: 2.5rem; text-align: center; position: relative;">

            <!-- Close Button -->
            <button id="btn-close-auth" class="btn btn-ghost btn-sm" aria-label="Cerrar"
                style="position: absolute; top: 1rem; right: 1rem; color: #71717a;"><svg class="ui-icon" aria-hidden="true"><use href="#icon-close"></use></svg></button>

            <!-- Premium SVG Logo at top -->
            <div style="margin-bottom: 1.5rem; display: flex; justify-content: center;">
                <div
                    style="background: #090a0f; border: 1px solid rgba(255,255,255,0.06); padding: 12px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);">
                    <svg width="42" height="42" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"
                        style="filter: drop-shadow(0px 0px 8px rgba(0, 210, 255, 0.5));">
                        <rect x="2" y="2" width="96" height="96" rx="28" fill="#0d0e12" stroke="#1f2937"
                            stroke-width="2" />
                        <path
                            d="M55 22C42.5 22 36.5 30 36.5 35C36.5 37.5 38.5 39.5 41 39.5C43.5 39.5 45 37.5 45.5 35.5C46.2 33 49 28.5 54.5 28.5C60.5 28.5 63 32.5 63 36.5C63 42.5 56.5 44.5 51 46.5L42.5 49.5C36.5 51.5 34.5 57.5 34.5 63.5C34.5 72.5 43.5 78 54 78C66.5 78 72 70 72 65C72 62.5 70 60.5 67.5 60.5C65 60.5 63.5 62.5 63 64.5C62.3 67 59.5 71.5 54 71.5C47.5 71.5 45 67.5 45 63.5C45 57.5 51.5 55.5 57 53.5L65.5 50.5C71.5 48.5 73.5 42.5 73.5 36.5C73.5 27.5 65.5 22 55 22Z"
                            fill="#ffffff" />
                        <path d="M56 25L38 52H48L44 75L62 48H52L56 25Z" fill="#ffffff" />
                    </svg>
                </div>
            </div>

            <!-- Tab Selectors -->
            <div class="auth-tabs">
                <button type="button" id="auth-tab-login" class="auth-tab active">Ingresar</button>
                <button type="button" id="auth-tab-register" class="auth-tab">Crear cuenta</button>
            </div>

            <!-- Title & Subtitle -->
            <div class="load-modal-header" style="display: none;">
                <h3 id="auth-title">Iniciar Sesión</h3>
            </div>
            <p id="auth-subtitle" style="display: none;"></p>

            <form id="auth-form" autocomplete="off">
                <!-- Apodo / Username (Solo Registro) -->
                <div id="auth-group-username" class="form-group hidden" style="text-align: left; margin-bottom: 1rem;">
                    <input type="text" id="auth-username" class="auth-field" placeholder="Apodo único (sin espacios)">
                </div>

                <!-- Correo Electrónico -->
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <input type="email" id="auth-email" class="auth-field" placeholder="Correo electrónico" required>
                </div>

                <!-- Contraseña -->
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <input type="password" id="auth-password" class="auth-field" placeholder="Contraseña" required>
                </div>

                <!-- Confirmar Contraseña (Solo Registro) -->
                <div id="auth-group-confirm-password" class="form-group hidden"
                    style="text-align: left; margin-bottom: 1rem;">
                    <input type="password" id="auth-confirm-password" class="auth-field"
                        placeholder="Confirmar contraseña">
                </div>

                <!-- Aceptación de Términos (Solo Registro) -->
                <div id="auth-group-terms" class="form-group hidden"
                    style="text-align: left; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="auth-terms"
                        style="width: 16px; height: 16px; cursor: pointer; accent-color: #00d2ff; margin: 0;">
                    <label for="auth-terms"
                        style="font-size: 0.8rem; color: #71717a; line-height: 1.3; cursor: pointer; user-select: none;">
                        Acepto los <a href="#"
                            style="color: #00d2ff; text-decoration: none; font-weight: 600; border-bottom: 1px dotted #00d2ff;">Términos
                            y Privacidad</a>
                    </label>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" id="btn-submit-auth" class="auth-submit-btn">
                    Iniciar Sesión
                </button>
            </form>

            <!-- Hidden Toggle elements to prevent script crashes -->
            <div style="display: none;">
                <span id="auth-toggle-text">¿No tienes una cuenta?</span>
                <a href="#" id="auth-toggle-mode">Créala aquí</a>
            </div>

            <!-- Cancel Button -->
            <div style="margin-top: 0.5rem;">
                <button type="button" id="btn-cancel-auth" class="auth-cancel-btn"
                    style="background: none; border: none; color: #71717a; font-size: 0.9rem; cursor: pointer; transition: color 0.2s;">Cancelar</button>
            </div>
        </div>
    </div>
