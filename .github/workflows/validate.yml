name: Validate & Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ─── 1. Syntax + smoke tests (sin Chromium) ───────────────────────────────
  syntax-and-smoke-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile backend/main.py backend/docx_builder.py backend/docx_builder_v1.py backend/models/session_document.py backend/adapters/legacy_to_v1.py

      - name: Validate JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate curriculum JSON
        run: python -m json.tool data/competencias.json > /dev/null

      - name: Run JS contract & adapter & template tests
        run: |
          node tests/test_contract_v1.js
          node tests/test_adapter_v1.js
          node tests/test_templates_v1.js
          node tests/test_presentation.js

      - name: Run storage smoke test
        run: |
          node tests/storage.test.js
          node tests/ai-provider-routing.test.js

      - name: Run Python contract & adapter & docx tests
        run: |
          python tests/test_contract_v1.py
          python tests/test_adapter_v1_py.py
          python tests/test_docx_builder_v1.py

      - name: Run backend DOCX smoke test
        run: python tests/backend_smoke.py

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run frontend security test
        run: |
          python tests/frontend_security.py
          python tests/ui_smoke.py
          python tests/ui_presentation_smoke.py

      - name: Check Supabase Edge Functions
        run: |
          deno check supabase/functions/openai-router/index.ts
          deno check supabase/functions/gemini-router/index.ts
          deno check supabase/functions/deepseek-router/index.ts
          deno check supabase/functions/pablito-mailer/index.ts

  # ─── 2. Build Windows .exe (solo en push a main/master) ───────────────────
  build-exe:
    needs: syntax-and-smoke-tests
    runs-on: windows-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    defaults:
      run:
        working-directory: source
    steps:
      # Windows strips trailing dots from paths. Create the normalized
      # workspace before running Node-based actions for this repository.
      - name: Prepare normalized Windows workspace
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}" | Out-Null

      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        working-directory: source/backend
        run: pyinstaller pablitopyhost.spec --clean --noconfirm

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: pablitopyhost-windows
          path: source/backend/dist/pablitopyhost.exe
          retention-days: 30
