name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Chromium for frontend security test
        run: python -m playwright install --with-deps chromium
      - name: Validate Python syntax
        run: python -m py_compile backend/main.py backend/docx_builder.py
      - name: Validate JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate curriculum JSON
        run: python -m json.tool data/competencias.json >/dev/null
      - name: Run storage smoke test
        run: node tests/storage.test.js
      - name: Run frontend security test
        run: python tests/frontend_security.py
      - name: Run backend DOCX smoke test
        run: python tests/backend_smoke.py
